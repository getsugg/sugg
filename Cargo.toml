[workspace]
members = [
    "crates/sugg-core",
    "crates/sugg-ast",
    "crates/sugg-engine",
    "crates/sugg-wasm",
    "crates/sugg-cli",
    "crates/sugg-deploy",
]
# Build and test these members by default
default-members = [
    "crates/sugg-core",
    "crates/sugg-ast",
    "crates/sugg-engine",
    "crates/sugg-cli",
    "crates/sugg-deploy",
    ".",                  # "." is the root sugg-tests package
]
resolver = "2"

[workspace.package]
version = "0.3.10"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/getsugg/sugg"
homepage = "https://getsugg.github.io/"

[workspace.dependencies]
# Shared dependencies
sugg-core = { path = "crates/sugg-core" }
sugg-ast = { path = "crates/sugg-ast" }
sugg-engine = { path = "crates/sugg-engine" }
sugg-wasm = { path = "crates/sugg-wasm" }
anyhow = "1.0.103"
tokio = { version = "1.52.3", features = ["rt", "macros", "fs", "process", "net", "time", "io-util"] }
ureq = { version = "3", default-features = false, features = ["json", "gzip", "rustls"] }
rquickjs = { version = "0.12", features = ["futures", "macro"] }
rkyv = { version = "0.8.17" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
console = "0.16.4"
dirs-next = "2.0.0"
tempfile = "3.27.0"
oxc = { version = "0.139", default-features = false, features = ["ast_visit", "semantic"] }


[workspace.dependencies.insta]
version = "1.48"
features = ["json"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true

# Root package: hosts the integration tests only
[package]
name = "sugg-tests"
version.workspace = true
edition.workspace = true
publish = false

[features]
install-tests = []

[dev-dependencies]
sugg-core.workspace = true
sugg-engine.workspace = true
insta.workspace = true
tempfile.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
