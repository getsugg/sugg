[package]
name = "sugg-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "WebAssembly bindings for Sugg completion-script AST extraction."
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
sugg-ast = { path = "../sugg-ast", features = ["wasm"] }
wasm-bindgen = "0.2"
serde.workspace = true
serde-wasm-bindgen = "0.6"
